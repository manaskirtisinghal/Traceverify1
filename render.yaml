databases:
  - name: traceverify-db
    plan: free
    databaseName: traceverify
    user: traceverify

services:
  - type: web
    name: traceverify-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: >-
      cd backend &&
      python -m scripts.init_db &&
      python -m scripts.ingest --evidence-dir ../data/synthetic --redteam ../data/raw/redteam_seed_subset.txt.gz &&
      uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: traceverify-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false